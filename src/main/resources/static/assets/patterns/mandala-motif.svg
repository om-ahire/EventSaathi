<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none" stroke="#7A1E2C" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.08">
  <!-- Center flower -->
  <circle cx="100" cy="100" r="10" />
